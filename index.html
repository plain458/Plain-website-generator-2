<title>Plain Website Generator 2</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#F3F4F6;--panel:#fff;--ink:#14181F;--muted:#5A6270;--line:#DADEE5;--line2:#E8EBF0;
  --acc:#0E6B5C;--acc-h:#0A574B;--acc-t:#E2F1EE;--acc-ink:#fff;
  --ok:#1B6B43;--ok-bg:#E3F3EA;--warn:#7A5200;--warn-bg:#FFF3D3;--err:#B3261E;--err-bg:#FDECEA;--info-bg:#EDF1F7;--info:#2F3B52;
  --r:10px;--hdr:56px;
  --f:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:400 15px/1.45 var(--f);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 55%,transparent);outline-offset:2px}
h1,h2,h3{font-family:var(--f);letter-spacing:-.02em;margin:0}

/* ---------- shell ---------- */
.app{height:100%;display:grid;grid-template-rows:var(--hdr) 1fr}
.top{display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.logo{font:700 21px/1 var(--f);letter-spacing:-.04em;color:var(--ink);background:none;border:0;padding:6px 2px;display:flex;align-items:baseline}
.logo i{font-style:normal;color:var(--acc)}
.back{height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:600;white-space:nowrap}
.back:hover{border-color:#aab1bf}
.ctx{min-width:0;display:flex;flex-direction:column;line-height:1.2;border-left:1px solid var(--line);padding-left:12px;margin-left:4px}
.ctx button{border:0;background:none;padding:0;text-align:left;font-weight:700;font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctx button:hover{text-decoration:underline;text-underline-offset:3px}
.ctx small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.stat{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);white-space:nowrap;padding:0 4px}
.stat::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.stat[data-s=dirty]::before{background:#D99A00}
.stat[data-s=saving]::before{background:var(--muted);animation:pulse 1s infinite}
.stat[data-s=error]{color:var(--err);font-weight:600}.stat[data-s=error]::before{background:var(--err)}
@keyframes pulse{50%{opacity:.25}}

.btn{min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:#aab1bf}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.pri:hover{background:var(--acc-h);border-color:var(--acc-h)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn.danger{color:var(--err)}
.btn.danger:hover{border-color:var(--err);background:var(--err-bg)}
.btn.solid-danger{background:var(--err);border-color:var(--err);color:#fff}
.btn.solid-danger:hover{background:#8f1d17}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}

/* ---------- library ---------- */
.lib{overflow:auto;min-height:0}
.lib-in{max-width:1120px;margin:0 auto;padding:32px 20px 64px}
.lib-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.lib-head h1{font-size:30px;line-height:1.1;font-weight:700}
.lib-head p{margin:6px 0 0;color:var(--muted)}
.lib-head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.lib-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.lib-bar .search{flex:1;min-width:200px;position:relative}
.lib-bar input[type=search]{width:100%;min-height:42px;padding:8px 12px 8px 38px;border:1px solid var(--line);border-radius:8px;background:#fff}
.lib-bar .search svg{position:absolute;left:12px;top:12px;width:18px;height:18px;color:var(--muted)}
.lib-bar select{width:auto;min-height:42px;padding:0 34px 0 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.pc.current{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-t)}
.pc .th{aspect-ratio:16/9;background:var(--line2);border-bottom:1px solid var(--line2);position:relative;overflow:hidden;cursor:pointer}
.pc .th img{width:100%;height:100%;object-fit:cover;display:block}
.pc .th .lt{position:absolute;left:10px;bottom:10px;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-weight:700;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.pc .bd{padding:14px 14px 10px;display:grid;gap:3px;min-width:0}
.pc h3{font-size:17px;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .ty{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .ed{font-size:12.5px;color:var(--muted);margin-top:6px}
.pc .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:9px;background:var(--line2);color:var(--muted);white-space:nowrap}
.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.up{background:var(--ok-bg);color:var(--ok)}
.pc .ft{display:flex;gap:8px;padding:0 14px 14px;margin-top:auto}
.pc .ft .btn{flex:1}
.pc .ft .more{flex:none;width:40px;padding:0;font-size:18px;letter-spacing:1px}
.empty{border:1.5px dashed var(--line);border-radius:14px;background:#fff;padding:44px 24px;text-align:center;display:grid;gap:10px;justify-items:center}
.empty h2{font-size:22px}.empty p{margin:0;color:var(--muted);max-width:44ch}
.empty .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:10px;margin:0 0 14px;font-size:14px}
.banner .tx{flex:1}.banner b{display:block}
.banner.warn{background:var(--warn-bg);color:#5A3C00}.banner.err{background:var(--err-bg);color:#7A1812}.banner.info{background:var(--info-bg);color:var(--info)}.banner.ok{background:var(--ok-bg);color:#12512F}
.banner .acts{display:flex;gap:8px;flex-wrap:wrap}
.lib-foot{margin-top:28px;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 18px}
.pop{position:fixed;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 36px -10px rgba(20,28,45,.35);padding:6px;min-width:210px;z-index:60}
.pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:7px;font-weight:500}
.pop button:hover{background:var(--paper)}
.pop button.danger{color:var(--err)}
.pop hr{border:0;border-top:1px solid var(--line2);margin:5px 0}

/* ---------- editor ---------- */
.work{display:grid;grid-template-columns:minmax(380px,440px) 1fr;min-height:0}
.panel{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 6px;gap:0;overflow-x:auto;flex:none}
.tab{border:0;background:none;padding:14px 8px 12px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--acc)}
.tab .n{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--warn-bg);color:var(--warn);font-size:11px;margin-left:6px;padding:0 5px}
.panes{flex:1;overflow:auto;min-height:0}
.pane{display:none;padding:18px 18px 32px}
.pane.on{display:block}
.pane h2{font-size:21px;line-height:1.2;margin:0 0 4px;font-weight:700}
.sub{color:var(--muted);margin:0 0 16px}
.grp{margin:24px 0 10px;font-weight:700;font-size:13.5px;color:var(--muted);padding-bottom:8px;border-bottom:1px solid var(--line)}
.fld{margin:0 0 13px}
.fld label{display:block;font-weight:600;margin-bottom:5px}
.fld label i{font-style:normal;color:var(--err);margin-left:3px}
.fld .hint{display:block;color:var(--muted);font-size:12.5px;margin-top:4px}
input[type=text],input[type=email],input[type=tel],input[type=url],input[type=password],input[type=search],select,textarea{width:100%;min-height:42px;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:#fff}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.err input,.err textarea{border-color:var(--err)}.err .hint{color:var(--err)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stick{position:sticky;bottom:-32px;margin:22px -18px -32px;padding:14px 18px;background:linear-gradient(0deg,#fff 72%,rgba(255,255,255,0));display:flex;gap:8px}
.stick .btn.pri{flex:1;min-height:46px}
details.opt{border:1px solid var(--line);border-radius:10px;margin:10px 0;background:#FAFBFC}
details.opt>summary{padding:12px 14px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.opt>summary::-webkit-details-marker{display:none}
details.opt>summary::after{content:"+";font-size:18px;color:var(--muted)}
details.opt[open]>summary::after{content:"\2013"}
details.opt .in{padding:4px 14px 12px}
.styles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sty{text-align:left;border:1.5px solid var(--line);border-radius:10px;background:#fff;padding:10px;display:grid;gap:7px}
.sty[aria-pressed=true]{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 20%,transparent)}
.sty b{font-size:13.5px;line-height:1.2}
.sty small{color:var(--muted);font-size:12px;line-height:1.3}
.sw{display:flex;height:22px;border-radius:5px;overflow:hidden;border:1px solid rgba(0,0,0,.08)}
.sw i{flex:1}
.colors{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.col input[type=color]{width:34px;height:34px;border:0;padding:0;background:none;border-radius:6px}
.col span{flex:1;font-weight:600}
.sec{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:#fff}
.sec.off{opacity:.62}
.sec>summary{list-style:none;display:flex;align-items:center;gap:6px;padding:8px 10px;cursor:pointer}
.sec>summary::-webkit-details-marker{display:none}
.sec .st{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec .st small{display:block;font-weight:400;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.sec .body{padding:8px 12px 14px;border-top:1px solid var(--line)}
.ib{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;font-size:14px;line-height:1;flex:none;padding:0}
.ib:hover{border-color:#aab1bf}.ib:disabled{opacity:.35;cursor:default}
.item{border:1px dashed var(--line);border-radius:8px;padding:10px;margin:8px 0;display:grid;gap:7px;position:relative}
.item .rm{position:absolute;top:6px;right:6px}
.item input,.item textarea{min-height:36px;padding:6px 9px}
.item textarea{min-height:56px}
.item input:first-of-type{padding-right:40px}
.toggle{position:relative;width:38px;height:22px;flex:none}
.toggle input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.toggle span{position:absolute;inset:0;background:#C3CAD6;border-radius:11px;transition:background .2s}
.toggle span::after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.toggle input:checked+span{background:var(--acc)}
.toggle input:checked+span::after{transform:translateX(16px)}
.toggle input:focus-visible+span{outline:3px solid color-mix(in srgb,var(--acc) 50%,transparent);outline-offset:2px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slot{border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:7px;background:#fff;align-content:start}
.slot.wide{grid-column:1/-1}
.slot .th{width:100%;aspect-ratio:4/3;border-radius:7px;object-fit:cover;background:var(--line2);border:1px solid var(--line2);display:block}
.slot .nm{display:flex;justify-content:space-between;gap:6px;font-weight:700;font-size:13.5px;align-items:center}
.slot .acts{display:flex;gap:5px;flex-wrap:wrap}
.slot input{min-height:32px;padding:5px 9px;font-size:13px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;background:#FAFBFC;color:var(--muted);display:grid;gap:8px;justify-items:center}
.drop.over{border-color:var(--acc);background:var(--acc-t)}
.note{padding:10px 12px;border-radius:9px;font-size:13.5px;line-height:1.4;margin:8px 0}
.note.warn{background:var(--warn-bg);color:#5A3C00}.note.info{background:var(--info-bg);color:var(--info)}.note.ok{background:var(--ok-bg);color:#12512F}.note.err{background:var(--err-bg);color:#7A1812}
.chk{display:flex;gap:10px;padding:11px 12px;border-radius:9px;margin:8px 0;font-size:13.5px}
.chk.warn{background:var(--warn-bg);color:#5A3C00}.chk.info{background:var(--info-bg);color:var(--info)}
.chk b{flex:none}
.ver{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line2);align-items:center}
.ver b{font-weight:600}.ver small{color:var(--muted);grid-column:1}
.ver .acts{grid-column:2;grid-row:1/3;display:flex;gap:6px}

/* setup (first-time) */
.setup{display:none;flex-direction:column;min-height:0;flex:1}
.panel[data-setup="1"] .setup{display:flex}
.panel[data-setup="1"] .tabs,.panel[data-setup="1"] .panes{display:none}
.steps{padding:14px 18px 12px;border-bottom:1px solid var(--line)}
.steps .top2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.steps .top2 b{font-size:13px;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.bars button{height:6px;border:0;border-radius:3px;background:var(--line);padding:0}
.bars button.done{background:#7FB5AA}.bars button.cur{background:var(--acc)}
.setup .body{flex:1;overflow:auto;padding:18px 18px 24px}
.setup .foot{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:#fff}
.setup .foot .sp{flex:1}

/* stage / preview */
.stage{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:6px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.bar .sp{flex:1}
.canvas{flex:1;min-height:0;padding:0 14px 14px;display:flex;justify-content:center;background-image:radial-gradient(#C9CED8 1px,transparent 1px);background-size:18px 18px}
.device{height:100%;width:100%;max-width:100%;background:#fff;border-radius:12px;box-shadow:0 0 0 1px rgba(20,28,45,.12),0 18px 50px -18px rgba(20,28,45,.4);overflow:hidden;transition:width .3s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column}
.device[data-d=tablet]{width:820px}.device[data-d=mobile]{width:390px}
.device .chrome{height:28px;flex:none;background:#EEF0F4;display:flex;align-items:center;gap:6px;padding:0 12px;border-bottom:1px solid var(--line)}
.device .chrome i{width:9px;height:9px;border-radius:50%;background:#C3CAD6}
.device .chrome span{margin-left:8px;font-size:11.5px;color:var(--muted)}
iframe{flex:1;width:100%;border:0;background:#fff}
.mob{display:none}

/* dialogs, toast */
dialog{border:0;border-radius:14px;padding:0;width:min(560px,94vw);box-shadow:0 30px 80px rgba(10,18,40,.45);color:var(--ink);max-height:92vh}
dialog::backdrop{background:rgba(15,22,40,.55)}
dialog .dh{padding:20px 22px 4px}dialog .dh h2{font-size:21px;line-height:1.25}
dialog .db{padding:8px 22px 6px;overflow:auto}
dialog .db p{margin:0 0 10px}
dialog .df{padding:14px 22px 20px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dl{display:grid;gap:10px;margin:14px 0}
.dl button{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:#fff}
.dl button:hover{border-color:var(--acc)}
.dl button b{display:block}.dl button small{color:var(--muted)}
.files{max-height:140px;overflow:auto;font:12.5px/1.6 ui-monospace,Menlo,monospace;background:#F3F5F8;border-radius:8px;padding:10px 12px;color:#34405A}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.7);display:grid;place-items:center;z-index:90;font-weight:600}
.busy>div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 22px;box-shadow:0 10px 30px rgba(0,0,0,.15)}

@media (max-width:900px){
  .app{grid-template-rows:var(--hdr) 1fr}
  .app[data-screen=editor]{grid-template-rows:var(--hdr) 1fr 56px}
  .work{grid-template-columns:1fr;position:relative}
  .panel,.stage{grid-area:1/1}
  .app[data-view=edit] .stage{display:none}

/* ---------- project generation ---------- */
function packFor(info){
  const t=(info.type||'').toLowerCase(),dsc=(info.desc||'').toLowerCase();
  const test=(txt,kw)=>kw.some(k=>new RegExp('(^|[^a-z])'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i').test(txt));
  for(const id in PACKS){if(id!=='generic'&&test(t,PACKS[id].kw))return PACKS[id]}
  for(const id in PACKS){if(id!=='generic'&&test(dsc,PACKS[id].kw))return PACKS[id]}
  return GENERIC;
}
function hintStyle(notes){
  const n=(notes||'').toLowerCase();
  const map=[['luxur','luxury'],['premium dark','luxury'],['minimal','minimal'],['bold','bold'],['creative','bold'],['tech','tech'],['elegant','elegant'],['industrial','industrial'],['friendly','local'],['corporate','corporate']];
  for(const m of map)if(n.includes(m[0]))return m[1];return null;
}
function resolveStyle(p){
  const pack=packFor(p.info);
  let id=p.design.style;
  if(!id||id==='auto')id=hintStyle(p.info.notes)||pack.styles[(p.variant||0)%pack.styles.length];
  const base=STYLES[id]||STYLES.corporate;
  const st=Object.assign({},base,{id});
  const pal={brand:st.brand,accent:st.accent,deep:st.deep};
  if((!p.design.style||p.design.style==='auto')&&pack.pal&&!hintStyle(p.info.notes))Object.assign(pal,pack.pal);
  if(p.design.brand){pal.brand=p.design.brand;pal.deep=mix(p.design.brand,'#000000',st.dark?.7:.55)}
  if(p.design.accent)pal.accent=p.design.accent;
  if(p.design.hero&&p.design.hero!=='auto')st.hero=p.design.hero;
  else if(pack.hero&&(!p.design.style||p.design.style==='auto')&&!STYLES[id].dark)st.hero=pack.hero;
  return{pack,st,pal};
}
const fillTokens=(s,p)=>String(s==null?'':s).replace(/\{name\}/g,p.info.name||'our business').replace(/\{loc\}/g,p.info.location||'');
function parseItems(text){
  return lines(text).map((ln,i)=>{
    const m=ln.match(/^(.+?)\s*(?::|\s[-–—]\s)\s*(.+)$/);
    return m?{t:m[1].trim(),d:m[2].trim(),i:ICON_CYCLE[i%ICON_CYCLE.length]}:{t:ln,d:'',i:ICON_CYCLE[i%ICON_CYCLE.length]};
  });
}
function parseStats(text){
  return lines(text).map(ln=>{const m=ln.split('|');return m.length>1?{n:m[0].trim(),l:m.slice(1).join('|').trim()}:null}).filter(x=>x&&/\d/.test(x.n));
}
function mkSection(type,p,pack){
  const id=type+'-'+uid();
  const S=(o)=>Object.assign({id,type,on:true,title:'',intro:'',items:[]},o);
  const pk=pack||packFor(p.info);
  const userSvc=parseItems(p.info.services);
  const tpl=k=>{const x=pk[k]||GENERIC[k];return x};
  switch(type){
    case'about':{const a=pk.about;const pts=a.pts.slice();
      if(p.info.whatsapp&&/phone|message/i.test(pts[2]||''))pts[2]=pts[2];
      return S({title:a.title,intro:p.info.desc||'',items:pts.map(t=>({t}))})}
    case'services':{const x=pk.services;return S({title:x.title,intro:x.intro,items:(userSvc.length?userSvc:x.items.map((it,i)=>({t:it[0],d:it[1],i:it[2]||ICON_CYCLE[i%8]})))})}
    case'menu':{const x=pk.services;return S({title:x.title,intro:x.intro,items:(userSvc.length?userSvc:x.items.map(it=>({t:it[0],d:it[1],p:''})))})}
    case'listings':{const x=pk.services;return S({title:'Property inquiries',intro:'Tell us which kind of property you are interested in.',items:userSvc.length?userSvc:[['Houses','Family homes and standalone properties.'],['Apartments','Flats and apartments to buy or rent.'],['Land','Plots for building or investment.'],['Commercial property','Offices, shops and business premises.']].map(it=>({t:it[0],d:it[1]}))})}
    case'why':{const x=tpl('why')||GENERIC.why;return S({title:x.title,intro:x.intro,items:x.items.map(it=>({t:it[0],d:it[1]}))})}
    case'process':{const x=tpl('process')||GENERIC.process;return S({title:x.title,intro:x.intro,items:x.items.map(it=>({t:it[0],d:it[1]}))})}
    case'benefits':{const x=pk.benefits||{title:'Benefits',intro:'',items:[]};return S({title:x.title,intro:x.intro,items:x.items.map(it=>({t:it[0],d:it[1]}))})}
    case'stats':return S({title:'',intro:'',items:parseStats(p.info.stats)});
    case'offers':return S({title:'Special offers',intro:'',items:lines(p.info.offers).map(t=>({t,d:''}))});

function generate(prev,opts){
  opts=opts||{};
  const p=prev?clone(prev):{v:1,info:{},design:{style:'auto',brand:'',accent:'',hero:'auto'},variant:0,images:{},content:null,dirty:false};
  if(opts.bump)p.variant=(p.variant||0)+1;
  const pack=packFor(p.info);
  const order=pack.order.slice();
  const types=order.filter(t=>{if(t==='stats')return parseStats(p.info.stats).length;if(t==='offers')return lines(p.info.offers).length;return true});
  // replace services with menu/listing layout when the pack asks for it
  const secs=types.map(t=>{
    if(t==='menu'&&pack.id!=='restaurant')return mkSection('services',p,pack);
    return mkSection(t,p,pack);
  });
  // drop sections the pack does not define content for
  const final=secs.filter(s=>!((s.type==='why'||s.type==='process')&&!pack[s.type]));
  p.content={hero:genHero(p,pack),sections:final};
  p.dirty=false;
  // clear illustration art so variant rotates; keep uploaded/url/stock images
  Object.keys(p.images).forEach(k=>{if(!p.images[k]||p.images[k].kind==='art')delete p.images[k]});
  return p;
}
function regenHero(prev){
  const p=clone(prev);p.variant=(p.variant||0)+1;p.heroArt=(p.heroArt||0)+1;
  const pack=packFor(p.info);p.content.hero=Object.assign({},p.content.hero,genHero(p,pack));
  if(p.images.hero&&p.images.hero.kind==='art')delete p.images.hero;
  return p;
}
/* resolved image info for a slot */
function slotImg(p,slot,pal,pack){
  const im=p.images[slot];
  if(im&&im.src)return{src:im.src,alt:im.alt||'',kind:im.kind||'upload',credit:im.credit};
  const idx=SLOTS.findIndex(s=>s[0]===slot);
  const v=(p.variant||0)+idx+(slot==='hero'?(p.heroArt||0):0);
  const alts={solar:['Solar panels under open sky','Solar panels installed on a rooftop','Battery and inverter units for solar storage'],food:['A plated dish on a table','A bowl of food with steam rising','Pendant lights above restaurant tables'],house:['A house exterior','City apartment buildings','A bright living room'],tech:['Software interface on a screen','Laptop and phone side by side','Connected network of nodes'],beauty:['Salon mirror and styling tools','Row of beauty product bottles','Salon mirror and styling tools'],fashion:['Garments on a rail','Rolls of fabric','Garments on a rail'],construction:['Crane beside a building frame','Construction blueprint','Crane beside a building frame'],health:['Medical cross and heartbeat line','Medical cross and heartbeat line','Medical cross and heartbeat line'],education:['Graduation cap and books','Open book','Graduation cap and books'],generic:['Abstract shapes in brand colours','Abstract city blocks','Abstract mountains']};
  const al=(alts[pack.art]||alts.generic)[v%3];
  return{src:artURI(pack.art,v,pal),alt:al+' (illustration)',kind:'art'};
}

/* ---------- client script that ships inside every generated site ---------- */
function siteClient(){
  var d=document,root=d.documentElement;root.classList.add('js');
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var nav=d.querySelector('.nav'),burger=d.querySelector('.burger');
  if(burger&&nav){
    burger.addEventListener('click',function(){var o=nav.classList.toggle('open');burger.setAttribute('aria-expanded',o?'true':'false')});
    nav.querySelectorAll('.nav-links a').forEach(function(a){a.addEventListener('click',function(){nav.classList.remove('open');burger.setAttribute('aria-expanded','false')})});
  }
  var onScroll=function(){if(nav)nav.classList.toggle('stuck',window.scrollY>8)};
  onScroll();window.addEventListener('scroll',onScroll,{passive:true});
  var rev=d.querySelectorAll('[data-reveal]');
  if(reduce||!('IntersectionObserver' in window)){rev.forEach(function(e){e.classList.add('in')})}
  else{var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12,rootMargin:'0px 0px -6% 0px'});rev.forEach(function(e,i){e.style.transitionDelay=(i%4)*70+'ms';io.observe(e)})}
  var counters=d.querySelectorAll('[data-count]');
  var run=function(el){
    var end=parseFloat(el.getAttribute('data-count')),suf=el.getAttribute('data-suffix')||'';
    if(reduce||isNaN(end)){el.textContent=(isNaN(end)?'':end.toLocaleString())+suf;return}
    var t0=null,dur=1300;
    var step=function(t){if(!t0)t0=t;var k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=Math.round(end*e).toLocaleString()+suf;if(k<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  };
  if('IntersectionObserver' in window){var co=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){run(e.target);co.unobserve(e.target)}})},{threshold:.5});counters.forEach(function(c){co.observe(c)})}
  else counters.forEach(run);
  var pimg=d.querySelector('.hero-media img');
  if(pimg&&!reduce&&!d.body.classList.contains('edit')){
    var tick=false;
    window.addEventListener('scroll',function(){if(tick)return;tick=true;requestAnimationFrame(function(){var y=Math.min(window.scrollY,900);pimg.style.transform='translate3d(0,'+(y*0.07)+'px,0) scale(1.08)';tick=false})},{passive:true});
  }
  var f=d.getElementById('contact-form');
  if(f&&f.getAttribute('data-mode')==='mailto'){
    f.addEventListener('submit',function(e){
      e.preventDefault();
      var fd=new FormData(f),to=f.getAttribute('data-to');
      var body='Name: '+(fd.get('name')||'')+'\nPhone / email: '+(fd.get('contact')||'')+'\n'+(fd.get('service')?'Interested in: '+fd.get('service')+'\n':'')+'\n'+(fd.get('message')||'');
      var subj='Website inquiry from '+(fd.get('name')||'a visitor');
      var st=d.getElementById('form-status');
      if(st)st.textContent='Opening your email app. If nothing opens, email '+to+' directly.';
      window.location.href='mailto:'+to+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);
    });
  }
}
/* ---------- inline text editing helper injected into the live preview ---------- */
function editClient(){
  var d=document;d.body.classList.add('edit');
  var st=d.createElement('style');
  st.textContent='[data-k]{outline:1px dashed transparent;outline-offset:3px;cursor:text;transition:outline-color .15s}[data-k]:hover{outline-color:#2B50E6}[data-k]:focus{outline:2px solid #2B50E6;background:rgba(43,80,230,.08)}';
  d.head.appendChild(st);
  d.querySelectorAll('[data-k]').forEach(function(el){
    el.setAttribute('contenteditable','true');el.setAttribute('spellcheck','true');
    el.addEventListener('blur',function(){parent.postMessage({sb:'edit',k:el.getAttribute('data-k'),v:el.innerText.replace(/\s+\n/g,'\n').trim()},'*')});
    el.addEventListener('keydown',function(e){if(e.key==='Enter'&&!el.hasAttribute('data-multi')){e.preventDefault();el.blur()}});
  });
  d.addEventListener('click',function(e){var a=e.target.closest('a,button');if(a&&!a.closest('[data-k]')||(a&&a.tagName==='A')){e.preventDefault()}},true);
  d.addEventListener('submit',function(e){e.preventDefault()},true);
}

.footer{background:var(--deep);color:var(--on-deep);padding:clamp(48px,6vw,80px) 0 28px}
.foot{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:2rem 3rem}
.foot h3{font-size:1rem;margin-bottom:.9rem}
.foot li{margin:.4rem 0}.foot a{text-decoration:none;opacity:.85}.foot a:hover{opacity:1;text-decoration:underline}
.foot p{opacity:.8;max-width:30rem;margin-top:.8rem}
.legal{margin-top:2.6rem;padding-top:1.4rem;border-top:1px solid color-mix(in srgb,var(--on-deep) 22%,transparent);font-size:.88rem;opacity:.75;display:flex;flex-wrap:wrap;gap:.6rem 2rem}
.wa{position:fixed;right:18px;bottom:18px;z-index:60;width:58px;height:58px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.28);transition:transform .2s}
.wa:hover{transform:scale(1.07)}
.wa svg{width:30px;height:30px}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.js [data-reveal]{opacity:0;transform:translateY(16px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.js [data-reveal].in{opacity:1;transform:none}
.edit [data-reveal]{opacity:1!important;transform:none!important}
@media (max-width:900px){
 .nav-links,.nav-cta{display:none}
 .burger{display:inline-flex}
 .nav.open .nav-links{display:flex;flex-direction:column;gap:0;position:absolute;top:100%;left:0;right:0;background:var(--bg);border-bottom:var(--bw) solid var(--line);padding:8px clamp(20px,5vw,56px) 20px}
 .nav.open .nav-links a{display:block;padding:14px 0;border-bottom:1px solid var(--line)}
 .hero--split .hero-in,.about,.why,.contact{grid-template-columns:1fr}
 .hero--split .hero-media{order:0;aspect-ratio:16/11}
 .about-img{aspect-ratio:16/11}
 .svc-row{grid-template-columns:2rem 1fr auto}
 .svc-row p{grid-column:2/-1}
 .steps li::after{display:none}
 .foot{grid-template-columns:1fr}
 .gal{grid-template-columns:repeat(2,1fr)}
 .gal figure,.gal figure:nth-child(n){grid-column:span 1;grid-row:span 1}
 .gal figure:nth-child(1){grid-column:span 2;grid-row:span 2}
}
@media (max-width:560px){.actions .btn{width:100%}.hero--stack .hero-wide{aspect-ratio:4/3}.hero--center .hero-wide{aspect-ratio:4/3}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}.js [data-reveal]{opacity:1;transform:none}}`;
}

const WA_ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21l1.7-5A9 9 0 1 1 8 19.3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path fill="currentColor" d="M9 7.5c-.6.5-.9 1.300-.6 2.300.9 2.600 3.200 4.700 5.800 5.500 1 .3 1.900-.1 2.400-.8l-.3-1.200-1.900-.9-.9.900c-1.100-.5-2.300-1.600-2.800-2.800l.8-.9-.9-1.900z"/></svg>';
const SOCIAL_NAMES=[['facebook','Facebook'],['instagram','Instagram'],['twitter','X'],['x.com','X'],['linkedin','LinkedIn'],['tiktok','TikTok'],['youtube','YouTube'],['wa.me','WhatsApp'],['t.me','Telegram']];
function parseSocial(text){
  return lines(text).map(u=>{let url=/^https?:\/\//i.test(u)?u:'https://'+u.replace(/^@/,'');let label='Website';for(const s of SOCIAL_NAMES){if(url.toLowerCase().includes(s[0])){label=s[1];break}}return{url,label}});
}

function pageTitle(p,pack){const t=p.info.type||pack.label;return p.info.name+' | '+t+(p.info.location?' in '+p.info.location:'')}

function renderBody(p,R,o){

      case'why':return wrapSec(s,'deep',`<div class="why"><div class="sec-head" data-reveal style="margin:0"><h2${K('sec.'+s.id+'.title')}>${esc(T(s.title))}</h2>${s.intro?`<p class="lede"${K('sec.'+s.id+'.intro',1)}>${esc(T(s.intro))}</p>`:''}</div><div class="why-list">${items.map((x,i)=>`<div data-reveal><h3${it(s,i,'t')}>${esc(T(x.t))}</h3><p${it(s,i,'d')}>${esc(T(x.d))}</p></div>`).join('')}</div></div>`);
      case'process':return wrapSec(s,tone,head(s)+`<ol class="steps">${items.map((x,i)=>`<li data-reveal><h3${it(s,i,'t')}>${esc(T(x.t))}</h3><p${it(s,i,'d')}>${esc(T(x.d))}</p></li>`).join('')}</ol>`);
      case'benefits':return wrapSec(s,tone,head(s)+`<div class="ben">${items.map((x,i)=>`<div data-reveal><h3${it(s,i,'t')}>${esc(T(x.t))}</h3><p${it(s,i,'d')}>${esc(T(x.d))}</p></div>`).join('')}</div>`);
      case'stats':{if(!items.length)return'';return wrapSec(s,'deep',`<div class="stats">${items.map((x,i)=>{const m=String(x.n).match(/^([^\d]*)([\d,.]+)(.*)$/);const num=m?parseFloat(m[2].replace(/,/g,'')):NaN;return`<div data-reveal><strong${m?` data-count="${num}" data-suffix="${esc(m[3])}"`:''}${it(s,i,'n')}>${esc(x.n)}</strong><span${it(s,i,'l')}>${esc(x.l)}</span></div>`}).join('')}</div>`)}
      case'gallery':{const ims=['g1','g2','g3','g4','g5','g6'].map(img);return wrapSec(s,tone,head(s)+`<div class="gal">${ims.map(m=>`<figure data-reveal><img src="${esc(m.src)}" alt="${esc(m.alt)}" loading="lazy" width="900" height="700"></figure>`).join('')}</div>`)}
      case'offers':{if(!items.length)return'';return`<section class="offers" id="${s.id}"><div class="wrap offers-in"><h2${K('sec.'+s.id+'.title')}>${esc(s.title||'Special offers')}</h2><ul>${items.map((x,i)=>`<li${it(s,i,'t')}>${esc(x.t)}</li>`).join('')}</ul></div></section>`}
      case'cta':return`<section class="cta" id="${s.id}"><div class="wrap cta-in" data-reveal><div><h2${K('sec.'+s.id+'.title')}>${esc(T(s.title))}</h2>${s.intro?`<p${K('sec.'+s.id+'.intro',1)}>${esc(T(s.intro))}</p>`:''}</div><div class="actions" style="margin:0">${tel?`<a class="btn btn--primary" href="${esc(tel)}">Call ${esc(info.phone)}</a>`:''}${wa?`<a class="btn btn--ghost" href="${esc(wa)}" target="_blank" rel="noopener">WhatsApp</a>`:mail?`<a class="btn btn--ghost" href="mailto:${esc(mail)}">Email us</a>`:''}</div></div></section>`;
      case'contact':{
        const svcOpts=(p.content.sections.find(x=>x.type==='services'||x.type==='menu')||{items:[]}).items.filter(x=>x.t).map(x=>x.t);

        const soc=parseSocial(info.social);
        return wrapSec(s,tone,`<div class="contact"><div data-reveal><h2${K('sec.'+s.id+'.title')}>${esc(T(s.title))}</h2>${s.intro?`<p class="lede"${K('sec.'+s.id+'.intro',1)}>${esc(T(s.intro))}</p>`:''}<div class="c-list">${list.join('')}</div>${soc.length?`<div class="social">${soc.map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.label)}</a>`).join('')}</div>`:''}</div>
<form class="form" id="contact-form"${formAttrs} data-reveal>${mode==='netlify'?'<input type="hidden" name="form-name" value="contact"><p hidden><label>Do not fill this in: <input name="bot-field"></label></p>':''}
<div class="field"><label for="f-name">Your name</label><input id="f-name" name="name" autocomplete="name" required></div>
<div class="field"><label for="f-contact">Phone or email</label><input id="f-contact" name="contact" autocomplete="email" required></div>
${svcOpts.length?`<div class="field"><label for="f-service">I am interested in</label><select id="f-service" name="service"><option value="">Select (optional)</option>${svcOpts.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>`:''}
<div class="field"><label for="f-msg">Message</label><textarea id="f-msg" name="message" required></textarea></div>
<button class="btn btn--primary" type="submit">${mode==='mailto'?'Send by email':'Send message'}</button>
<p class="form-note" id="form-status" role="status">${mode==='mailto'?'This opens your email app with your message ready to send.':'We will reply using the details you give us.'}</p></form></div>`)}
    }
    return'';
  });
  const credits=[...new Set(['hero','about','g1','g2','g3','g4','g5','g6'].map(k=>p.images[k]&&p.images[k].credit).filter(Boolean))];
  const navLinks=navItems.map(n=>`<li><a href="#${n[0]}">${n[1]}</a></li>`).join('');
  const social=parseSocial(info.social);
  const footer=`<footer class="footer"><div class="wrap"><div class="foot"><div><a class="brand" href="#top" style="margin:0">${logo}<span>${esc(name)}</span></a>${info.desc?`<p>${esc(info.desc)}</p>`:''}</div><div><h3>Explore</h3><ul>${navItems.map(n=>`<li><a href="#${n[0]}">${n[1]}</a></li>`).join('')}</ul></div><div><h3>Contact</h3><ul>${info.phone?`<li><a href="${esc(tel)}">${esc(info.phone)}</a></li>`:''}${mail?`<li><a href="mailto:${esc(mail)}">${esc(mail)}</a></li>`:''}${wa?`<li><a href="${esc(wa)}" target="_blank" rel="noopener">WhatsApp</a></li>`:''}${social.map(x=>`<li><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.label)}</a></li>`).join('')}</ul></div></div><div class="legal"><span>&copy; ${new Date().getFullYear()} ${esc(name)}. All rights reserved.</span>${credits.length?`<span>Photos: ${esc(credits.join(', '))} on Unsplash</span>`:''}</div></div></footer>`;
  const floatWA=wa?`<a class="wa" href="${esc(wa)}" target="_blank" rel="noopener" aria-label="Chat with ${esc(name)} on WhatsApp">${WA_ICON}</a>`:'';
  return`<a class="skip" href="#main">Skip to content</a><header class="nav" id="top"><div class="wrap nav-in"><a class="brand" href="#top">${logo}<span>${esc(name)}</span></a><ul class="nav-links" id="nav-links">${navLinks}</ul>${tel?`<a class="btn btn--primary btn--sm nav-cta" href="${esc(tel)}">${icon('phone','ico').replace('class="ico"','class="ico" style="width:1.1rem;height:1.1rem"')}Call now</a>`:''}<button class="burger" type="button" aria-label="Menu" aria-expanded="false" aria-controls="nav-links"><span></span></button></div></header><main id="main">${hero}${parts.join('')}</main>${footer}${floatWA}`;
}
function jsonLD(p,pack){
  const i=p.info,o={'@context':'https://schema.org','@type':'LocalBusiness',name:i.name};
  if(i.desc)o.description=i.desc;if(i.phone)o.telephone=i.phone;if(i.email)o.email=i.email;
  if(i.address)o.address={'@type':'PostalAddress',streetAddress:i.address};if(i.location)o.areaServed=i.location;
  const s=parseSocial(i.social).map(x=>x.url);if(s.length)o.sameAs=s;
  return JSON.stringify(o).replace(/</g,'\\u003c');
}
/* mode: 'inline' = one self-contained document (preview / single file); 'files' = linked css/js */
function renderSite(p,o){
  o=o||{};
  const R=resolveStyle(p),{pack,st}=R;
  const css=siteCSS(p,R),js='('+siteClient.toString()+')();'+(o.edit?'('+editClient.toString()+')();':'');
  const fam=st.fonts.map(f=>'family='+f.replace(/ /g,'+')).join('&');
  const fontLink=`<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?${fam}&display=swap">`;
  const title=pageTitle(p,pack),desc=metaDesc(p);
  const fav=o.favicon||'';
  const inline=o.mode!=='files';
  return`<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc(title)}</title>
<meta name="description" content="${esc(desc)}">
<meta name="theme-color" content="${R.pal.brand}">
<meta property="og:type" content="website"><meta property="og:title" content="${esc(title)}"><meta property="og:description" content="${esc(desc)}">
${fav?`<link rel="icon" href="${esc(fav)}">`:''}
${fontLink}
${inline?`<style>${css}</style>`:'<link rel="stylesheet" href="css/styles.css">'}
<script type="application/ld+json">${jsonLD(p,pack)}<\/script>
</head>
<body>
${renderBody(p,R,o)}
${inline?`<script>${js}<\/script>`:'<script src="js/main.js" defer><\/script>'}
</body>
</html>`;
}

/* ---------- export: assets, README, ZIP ---------- */
function dataToBytes(uri){
  const comma=uri.indexOf(',');const meta=uri.slice(5,comma),body=uri.slice(comma+1);
  const mime=meta.split(';')[0];let bytes;
  if(/;base64/.test(meta)){const bin=atob(body);bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i)}
  else bytes=new TextEncoder().encode(decodeURIComponent(body));
  const ext={'image/jpeg':'jpg','image/png':'png','image/svg+xml':'svg','image/webp':'webp','image/gif':'gif'}[mime]||'bin';
  return{bytes,ext};
}
function faviconSVG(p,R){
  const ch=(p.info.name||'B').trim().charAt(0).toUpperCase()||'B';
  return`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="${R.st.r>8?16:6}" fill="${R.pal.brand}"/><text x="32" y="44" font-family="Arial,sans-serif" font-size="36" font-weight="700" text-anchor="middle" fill="${onColor(R.pal.brand)}">${esc(ch)}</text></svg>`;
}
function reviewList(p){
  const R=resolveStyle(p),pack=R.pack,out=[],i=p.info;
  const art=['hero','about','g1','g2','g3','g4','g5','g6'].filter(k=>!(p.images[k]&&p.images[k].src));
  if(!i.location)out.push(['warn','No location was entered, so the site does not mention where the business operates.']);

/* Turn any accepted file into a list of {id,createdAt,updatedAt,data(raw),assets,legacy} */
function parseBackupText(text){
  let j;try{j=JSON.parse(text)}catch(e){throw new Error('This file is not valid JSON, so it cannot be a Plain project. It may be damaged or cut short.')}
  if(!j||typeof j!=='object')throw new Error('This file does not contain a project.');
  if(j.format===APP_FORMAT||j.format===LIB_FORMAT){
    if(typeof j.schema==='number'&&j.schema>SCHEMA)throw new Error('This backup was made by a newer version of Plain Website Generator. Update the tool and try again.');
    const list=j.format===APP_FORMAT?[j.project]:(Array.isArray(j.projects)?j.projects:[]);
    if(!list.length||list.some(x=>!x||typeof x!=='object'||!x.data))throw new Error('The backup is missing its project data.');

  }

  const issues=[];

  for(const id of want){

function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>i.naturalWidth?res(i):rej(new Error('empty'));i.onerror=()=>rej(new Error('unreadable'));i.src=src})}
async function compressImage(file,max,mime){
  if(!file||file.size===0)throw new Error('The file is empty.');
  if(file.size>40*1024*1024)throw new Error('The file is larger than 40 MB.');
  if(file.type&&!/^image\//.test(file.type))throw new Error('It is not an image.');
  const url=URL.createObjectURL(file);
  try{
    let im;try{im=await loadImg(url)}catch(e){throw new Error('This image format is not supported by the browser (try JPG, PNG or WebP).')}
    const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*k));c.height=Math.max(1,Math.round(im.naturalHeight*k));
    const x=c.getContext('2d');if(mime==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}
    x.drawImage(im,0,0,c.width,c.height);
    const uri=c.toDataURL(mime,.84);
    return{uri,bytesIn:file.size,bytesOut:Math.round((uri.length-uri.indexOf(',')-1)*.75),w:c.width,h:c.height,resized:k<1};
  }finally{URL.revokeObjectURL(url)}
}

/* ---------- versions (snapshots) ---------- */
async function takeSnapshot(label,auto){
  if(!P||!(P.content||P.info.name.trim()))return null;
  if(!await flush()){if(!auto)toast('Could not save a version because the project itself could not be saved.',5000);return null}
  const st=toStored(P),hash=fnv(JSON.stringify(st.data));
  const all=await DB.listSnapshots(P.id);all.sort((a,b)=>a.createdAt<b.createdAt?1:-1);
  if(auto&&all[0]&&all[0].hash===hash)return null;
  const snap={sid:rid('s'),pid:P.id,createdAt:nowISO(),label:label||'',auto:!!auto,hash,refs:st.refs,data:st.data};
  const removed=await DB.addSnapshot(snap,MAX_SNAPSHOTS);
  if(removed&&!auto)toast('Version saved. The oldest automatic version was removed (limit '+MAX_SNAPSHOTS+').',4500);
  return snap;
}
async function restoreSnapshot(sid){
  const snap=await DB.getSnapshot(sid);if(!snap||snap.pid!==P.id){toast('That version no longer exists.');return}
  const r=await ask({title:'Restore this version?',body:`<p>Restore the version from <b>${esc(fmtDate(snap.createdAt))}</b>${snap.label?' (“'+esc(snap.label)+'”)':''}?</p><p>Your current version is saved first, so you can come back to it.</p>`,actions:[{id:'cancel',label:'Cancel'},{id:'go',label:'Restore',cls:'pri'}]});
  if(r.action!=='go')return;
  const done=busy('Restoring…');
  try{
    await takeSnapshot('Before restore',true);
    const issues=[],data=sanitizeStored(snap.data,issues);data.setup={done:true,step:1};
    const rows=await DB.getAssets(P.id,refsOf(data));
    const h=await hydrate(data,{id:P.id,createdAt:P.createdAt,updatedAt:P.updatedAt},rows);
    clearPreviewUrls();P=h.p;if(!P.content)P=generate(P);touch();await flush();
    updateCtx();setTab(TAB);renderPreview();refreshBadge();done();
    toast(h.missing?'Restored, but '+h.missing+' image(s) were unavailable.':'Version restored',4000);
  }catch(e){done();toast('Could not restore: '+errMsg(e),5000)}
}

/* ---------- import ---------- */
async function importFiles(fileList,opt){
  opt=opt||{};let imported=0;const notes=[];let lastId='';
  for(const file of fileList){
    try{
      if(file.size>MAX_IMPORT_BYTES)throw new Error('The file is larger than '+fmtBytes(MAX_IMPORT_BYTES)+'.');
      const list=parseBackupText(await file.text());
      for(const x of list){
        try{const r=await importOne(x,opt,file.name);if(r){imported++;lastId=r.id;r.issues.forEach(i=>notes.push('“'+r.name+'”: '+i))}}
        catch(e){notes.push((file.name||'File')+': '+errMsg(e))}
      }
    }catch(e){notes.push((file.name||'File')+': '+errMsg(e))}
  }
  await refreshLibrary();
  if(notes.length)await ask({title:imported?'Imported with notes':'Nothing was imported',body:notes.map(n=>`<p>${esc(n)}</p>`).join(''),actions:[{id:'ok',label:'OK',cls:'pri'}]});
  if(imported&&!notes.length)toast(imported===1?'Project imported':imported+' projects imported');
  return imported;
}
async function importOne(x,opt){
  const v=validatePortable(x);
  if(legacyHits(v.data.info).length){
    let act=opt.autoScrub?'scrub':'';
    if(!act){const r=await ask({title:'Old demo details found',body:'<p>This project contains contact details from the previous generator’s built-in demo. They are probably not a real client’s details.</p>',actions:[{id:'cancel',label:'Cancel'},{id:'keep',label:'Import as is'},{id:'scrub',label:'Import without those details',cls:'pri'}]});act=r.action}
    if(act==='cancel')return null;if(act==='scrub')scrubLegacyDemo(v.data);
  }
  let id=v.id||rid('p'),title=v.data.title;
  const existing=v.id?await DB.getProject(v.id):null;
  let overwrite=false;
  if(existing){
    const r=await ask({title:'This project already exists',body:`<p><b>${esc(existing.name)}</b> is already in your library (last edited ${esc(fmtDate(existing.updatedAt))}). The file holds a version from ${esc(fmtDate(v.updatedAt))}.</p><p>Overwriting replaces the library version. A copy of it is kept in the project’s version history.</p>`,actions:[{id:'cancel',label:'Cancel'},{id:'copy',label:'Keep both'},{id:'over',label:'Overwrite',cls:'pri'}]});
    if(r.action==='cancel')return null;
    if(r.action==='copy'){id=rid('p');title=((title||v.data.info.name||'Imported project')+' (imported)').slice(0,120);v.data.title=title}
    else{
      overwrite=true;
      const snap={sid:rid('s'),pid:id,createdAt:nowISO(),label:'Before import',auto:true,hash:fnv(JSON.stringify(existing.data)),refs:existing.refs||[],data:existing.data};
      await DB.addSnapshot(snap,MAX_SNAPSHOTS);
    }
  }
  const refs=refsOf(v.data),assets=refs.filter(r=>v.assets[r]).map(r=>{const blob=dataUriToBlob(v.assets[r]);return{key:id+':'+r,pid:id,id:r,mime:blob.type,size:blob.size,blob}});
  const t=nowISO(),cur=overwrite?await DB.getProject(id):null;
  const rec={id,name:title||v.data.info.name||'Untitled project',type:v.data.info.type,createdAt:overwrite?existing.createdAt:v.createdAt,updatedAt:t,rev:cur?cur.rev+1:1,schema:SCHEMA,thumb:'',thumbKey:'',brand:'',setupDone:v.data.setup.done,refs,data:v.data};
  await DB.writeProject(rec,assets,cur?cur.rev:null);
  try{const{p}=await loadProject(id),th=await computeThumb(p);const r2=await DB.getProject(id);await DB.writeProject(Object.assign({},r2,{thumb:await th.make(),thumbKey:th.key,brand:th.brand,rev:r2.rev+1}),[],r2.rev)}catch(e){}
  return{id,name:rec.name,issues:[...new Set(v.issues)]};
}

function pickFile(multi,cb){const i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=!!multi;i.onchange=()=>i.files.length&&cb([...i.files]);i.click()}
const defAlt=slot=>{const n=P.info.name||'Business';if(slot==='hero')return n+' – '+(P.info.type||'business');if(slot==='about')return'About '+n;return n+' gallery image '+slot.slice(1)};
async function setUpload(slot,file){
  const r=await compressImage(file,1600,'image/jpeg');const prev=P.images[slot]||{};
  P.images[slot]={id:rid('i'),src:r.uri,kind:'upload',alt:prev.alt&&prev.kind!=='art'?prev.alt:defAlt(slot)};return r;
}
const sizeNote=r=>fmtBytes(r.bytesIn)+' → '+fmtBytes(r.bytesOut)+(r.resized?' (scaled to fit 1600 px)':'');
async function addPhotos(files,only){
  files=[...files].filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|webp|gif|heic|heif|avif)$/i.test(f.name));
  if(!files.length){toast('No image files found');return}
  const targets=only?[only]:SLOT_IDS.filter(k=>!P.images[k]||!P.images[k].src||P.images[k].kind==='art');
  if(!targets.length){toast('All 8 image slots are filled. Use Replace on a slot to swap a picture.',4500);return}
  const use=files.slice(0,targets.length),skipped=files.length-use.length,fails=[];let ok=0,last=null;
  const done=busy('Adding '+use.length+' photo'+(use.length>1?'s':'')+'…');
  for(let i=0;i<use.length;i++){try{last=await setUpload(targets[i],use[i]);ok++}catch(e){fails.push(use[i].name+': '+errMsg(e))}}
  done();
  if(ok){change();refreshActive()}
  if(fails.length)await ask({title:ok?'Some photos could not be added':'No photos were added',body:fails.map(f=>`<p>${esc(f)}</p>`).join(''),actions:[{id:'ok',label:'OK',cls:'pri'}]});
  else toast((ok===1&&last?'Photo added · '+sizeNote(last):ok+' photos added')+(skipped?' · '+skipped+' did not fit':''),4200);
}
function imagesHTML(){
  const R=resolveStyle(P),key=store.get('plain.unsplash')||store.get('sitebench.unsplash')||'',q=encodeURIComponent(R.pack.search);
  const KIND={art:'Illustration',upload:'Uploaded',url:'Link',stock:'Stock'};
  const logo=`<div class="slot wide"><div class="nm"><span>Logo</span><span class="tag ${P.info.logo?'up':''}">${P.info.logo?'Uploaded':'Lettermark'}</span></div>${P.info.logo?`<img class="th" style="aspect-ratio:4/1;object-fit:contain;background:#fff" src="${esc(P.info.logo)}" alt="Current logo">`:'<div class="sub" style="margin:0">No logo yet. A lettermark from the business name is used.</div>'}<div class="acts"><button class="btn sm" data-act="logo-up">${P.info.logo?'Replace logo':'Upload logo'}</button>${P.info.logo?'<button class="btn sm danger" data-act="logo-rm">Remove</button>':''}</div></div>`;

    return`<div class="slot" data-s="${s[0]}"><img class="th" src="${esc(im.src)}" alt=""><div class="nm"><span>${s[1]}</span><span class="tag ${im.kind==='art'?'':'up'}">${KIND[im.kind]||'Image'}</span></div><input type="text" data-alt value="${esc(im.alt)}" aria-label="Alt text for ${s[1]}" placeholder="Describe the image"><div class="acts"><button class="btn sm" data-a="up">${im.kind==='art'?'Upload':'Replace'}</button><button class="btn sm" data-a="url">Link</button>${im.kind!=='art'?'<button class="btn sm danger" data-a="reset">Remove</button>':''}${g?`<button class="ib" data-a="left" ${gi===1?'disabled':''} aria-label="Move ${s[1]} earlier" title="Move earlier">←</button><button class="ib" data-a="right" ${gi===6?'disabled':''} aria-label="Move ${s[1]} later" title="Move later">→</button>`:''}</div></div>`}).join('');
  return`<div class="drop" id="dropzone"><span>Drop photos here, or</span><button class="btn pri" data-act="multi">Choose photos</button><small>Fills empty slots in order. Photos are resized to 1600 px and stored with this project.</small></div>
<div class="grp">Logo</div><div class="slots">${logo}</div>
<div class="grp">Photo slots</div><div class="slots">${slots}</div>
<div class="grp">Stock photos</div>
<p class="sub">Automatic stock photos need a free Unsplash access key. It stays on this device, is not part of any project or backup, and is never put in an exported site.</p>
<div class="fld"><label>Unsplash access key</label><input type="password" id="ukey" value="${esc(key)}" placeholder="Paste key from unsplash.com/developers" autocomplete="off"></div>
<div class="row2"><button class="btn pri" data-act="stock">Fetch “${esc(R.pack.search)}”</button><a class="btn" target="_blank" rel="noopener" href="https://unsplash.com/s/photos/${q}">Browse manually</a></div>
<p class="sub" id="stockMsg" style="margin-top:8px"></p>`;

function paneImages(){

  if(!P.content){el.innerHTML='<div class="note info">Add the business name in Details first, then add images here.</div>';return}
  el.innerHTML='<h2>Images</h2><p class="sub">Your own photos always win. Empty slots show illustrations in the brand colours, so nothing looks broken.</p>'+imagesHTML();

async function fetchStock(){
  const key=(store.get('plain.unsplash')||'').trim(),msg=$('#stockMsg');
  if(!key){msg.textContent='Paste your Unsplash access key first.';return}
  const R=resolveStyle(P);msg.textContent='Searching…';
  try{
    const r=await fetch('https://api.unsplash.com/search/photos?per_page=12&orientation=landscape&content_filter=high&query='+encodeURIComponent(R.pack.search),{headers:{Authorization:'Client-ID '+key}});
    if(!r.ok)throw new Error(r.status===401?'The key was rejected.':'Unsplash returned '+r.status+'.');
    const j=await r.json();if(!j.results||!j.results.length)throw new Error('No photos found.');
    const free=SLOT_IDS.filter(k=>!P.images[k]||P.images[k].kind==='art'||P.images[k].kind==='stock');
    let n=0;
    for(let i=0;i<free.length&&i<j.results.length;i++){
      const ph=j.results[i],url=ph.urls.raw+(ph.urls.raw.includes('?')?'&':'?')+'w=1600&q=78&fit=crop&auto=format';
      let src='';
      try{const b=await (await fetch(url)).blob();src=(await compressImage(new File([b],'p.jpg',{type:b.type||'image/jpeg'}),1600,'image/jpeg')).uri}catch(e){continue}
      P.images[free[i]]={id:rid('i'),src,kind:'stock',alt:S(ph.alt_description||ph.description,300)||defAlt(free[i]),credit:S(ph.user&&ph.user.name,120)};n++;
    }
    change();refreshActive();const m=$('#stockMsg');if(m)m.textContent=n+' stock photos added. Credit is placed in the site footer, as Unsplash requires.';
  }catch(err){msg.textContent=(err.message||'Could not reach Unsplash.')+' Check your key and connection.'}
}

  if(s===5)return`<h2>Add pictures</h2><p class="sub">Optional. Empty slots show illustrations until real photos are added.</p>${imagesHTML()}`;
  const l=reviewAll(P),w=l.filter(x=>x[0]==='warn');
  return`<h2>Check the preview</h2><p class="sub">The finished page is on the right (or under the Preview button on a phone). The project is already saved in your library.</p>${w.length?`<div class="note warn"><b>${w.length} thing${w.length>1?'s':''} to check before delivery</b><br>${w.map(x=>esc(x[1])).join('<br>')}</div>`:'<div class="note ok">Nothing flagged for review.</div>'}<p class="sub">Open the full editor to fine-tune text, sections and images. You can export the website from there at any time.</p>`;
}
function renderSetup(){
  if(!P||!P.setup)return;
  const s=P.setup.step;
  $('#setupSteps').innerHTML=`<div class="top2"><b>Step ${s} of 6 · ${SETUP_STEPS[s-1]}</b><button class="btn sm" data-sact="skipall">Skip setup</button></div><div class="bars">${SETUP_STEPS.map((n,i)=>`<button class="${i+1<s?'done':i+1===s?'cur':''}" data-sact="goto" data-n="${i+1}" aria-label="Step ${i+1}: ${n}" ${i+1>s?'disabled':''}></button>`).join('')}</div>`;
  const body=$('#setupBody');const sc=body.scrollTop;body.innerHTML=setupBody(s);body.scrollTop=sc;
  const optional=s>=2&&s<=5;
  $('#setupFoot').innerHTML=`${s>1?'<button class="btn" data-sact="back">Back</button>':''}<span class="sp"></span>${optional?'<button class="btn" data-sact="next">Skip this step</button>':''}${s<6?`<button class="btn pri" data-sact="next">${s===5?'Continue':'Continue'}</button>`:'<button class="btn" data-sact="export">Export website</button><button class="btn pri" data-sact="finish">Open the editor</button>'}`;
}
function setupGo(n){P.setup.step=n;touch();renderSetup();if(P.content)renderPreview();if(n===6)refreshBadge()}
function setupNext(){
  const s=P.setup.step;
  if(s===1){
    if(!P.info.name.trim()){const w=$('[data-w="name"]');if(w){w.classList.add('err');const i=w.querySelector('input');if(i)i.focus()}toast('Enter the business name to continue');return}
  }
  if((s===1||s===4)&&!P.dirty){P=generate(P);change()}else if(s===1&&!P.content){P=generate(P);change()}
  if(s<6)setupGo(s+1);
}
function setupFinish(){
  if(!P.info.name.trim()){setupGo(1);toast('Enter the business name first');return}
  if(!P.content)P=generate(P);
  P.setup={done:true,step:1};change();setSetupMode(false);setTab('content');updateCtx();renderPreview();
  toast('Setup finished. Everything is saved to your library.');
}
$('#panel').addEventListener('click',e=>{
  const b=e.target.closest('[data-sact]');if(!b||!P)return;const a=b.dataset.sact;
  if(a==='back')setupGo(Math.max(1,P.setup.step-1));
  if(a==='next')setupNext();
  if(a==='goto'){const n=+b.dataset.n;if(n<=P.setup.step)setupGo(n)}
  if(a==='skipall'){if(!P.info.name.trim()){toast('Enter the business name first');return}setupFinish()}
  if(a==='finish')setupFinish();
  if(a==='export'){if(!P.content)P=generate(P);openExport()}
});

/* ---------- panel events (all tabs + setup) ---------- */
$('#panel').addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.f){
    P.info[t.dataset.f]=t.value.slice(0,LONG_KEYS.has(t.dataset.f)?4000:300);
    const w=t.closest('.fld');if(w)w.classList.remove('err');
    if(t.dataset.f==='name'||t.dataset.f==='type')updateCtx();
    if(t.dataset.f==='formEndpoint'){const v=t.value.trim(),bad=v&&!(v.toLowerCase()==='netlify'||isHttp(v));const h=w&&w.querySelector('.hint');w.classList.toggle('err',!!bad);if(bad&&h)h.dataset.old=h.dataset.old||h.textContent,h.textContent='Enter a full https:// link or the word netlify.';else if(h&&h.dataset.old)h.textContent=h.dataset.old;if(bad)return}
    change();return;
  }
  if(t.dataset.p){setPath(t.dataset.p,t.value);P.dirty=true;change();return}
  if(t.dataset.c){P.design[t.dataset.c]=t.value;change();return}
  if(t.hasAttribute('data-alt')){const slot=t.closest('.slot').dataset.s,im=P.images[slot];if(im)im.alt=t.value.slice(0,300);else P.images[slot]={src:'',kind:'art',alt:t.value.slice(0,300)};change();return}
  if(t.id==='ukey'){store.set('plain.unsplash',t.value.trim());return}
});
$('#panel').addEventListener('change',e=>{
  const t=e.target;
  if(t.hasAttribute('data-hero')){P.design.hero=t.value;change()}
  if(t.hasAttribute('data-title')){P.title=t.value.trim().slice(0,120);touch();updateCtx()}
});
$('#panel').addEventListener('click',async e=>{
  const t=e.target;
  const sa=t.closest('[data-sa]');
  if(sa){e.preventDefault();e.stopPropagation();const det=sa.closest('details.sec'),id=det.dataset.id,secs=P.content.sections,i=secs.findIndex(x=>x.id===id),k=sa.dataset.sa;
    if(k==='view')scrollPreviewTo(id);
    if(k==='dup'){const c=JSON.parse(JSON.stringify(secs[i]));c.id=c.type+'-'+uid();secs.splice(i+1,0,c);P.dirty=true;change();paneContent();toast('Section duplicated')}
    if(k==='up'||k==='down'){const j=i+(k==='up'?-1:1);if(j>=0&&j<secs.length){[secs[i],secs[j]]=[secs[j],secs[i]];P.dirty=true;change();paneContent()}}
    if(k==='rm'){const r=await ask({title:'Delete this section?',body:`<p>The “${esc(SEC_LABEL[secs[i].type])}” section and its text will be removed from the website. You can add it again from “Add a section”.</p>`,actions:[{id:'cancel',label:'Cancel'},{id:'go',label:'Delete section',cls:'solid-danger'}]});if(r.action==='go'){P.content.sections=secs.filter(x=>x.id!==id);P.dirty=true;change();paneContent()}}
    return;
  }
  if(t.closest('.toggle')&&t.hasAttribute('data-on')){e.stopPropagation();const det=t.closest('details.sec'),s=P.content.sections.find(x=>x.id===det.dataset.id);s.on=t.checked;det.classList.toggle('off',!s.on);P.dirty=true;change();return}
  if(t.closest('.toggle')){e.stopPropagation();return}
  const act=t.closest('[data-act]')&&t.closest('[data-act]').dataset.act;
  const st=t.closest('[data-style]');
  if(st){P.design.style=st.dataset.style;change();refreshActive();return}
  if(t.closest('[data-rmi]')){const b=t.closest('[data-rmi]'),det=b.closest('details.sec'),s=P.content.sections.find(x=>x.id===det.dataset.id);s.items.splice(+b.dataset.rmi,1);P.dirty=true;change();paneContent();return}
  if(t.closest('[data-addi]')){const det=t.closest('details.sec'),s=P.content.sections.find(x=>x.id===det.dataset.id);s.items.push({});P.dirty=true;change();paneContent();return}
  if(t.closest('[data-addsec]')){const type=$('#addType').value,s=mkSection(type,P);if(type==='stats'||type==='offers')s.items=s.items.length?s.items:[{}];const ci=P.content.sections.findIndex(x=>x.type==='cta'||x.type==='contact');P.content.sections.splice(ci<0?P.content.sections.length:ci,0,s);P.dirty=true;change();paneContent();toast(SEC_LABEL[type]+' added');return}
  const ab=t.closest('[data-a]');
  if(ab){
    const slotEl=ab.closest('.slot'),slot=slotEl&&slotEl.dataset.s,a=ab.dataset.a;
    if(a==='up')pickFile(false,f=>addPhotos(f,slot));
    if(a==='url'){const r=await ask({title:'Use an image link',body:'<div class="fld"><label for="iu">Image address</label><input type="text" id="iu" name="u" placeholder="https://example.com/photo.jpg"><span class="hint">The picture stays hosted elsewhere, so it can stop working. Uploading is more reliable.</span></div>',actions:[{id:'cancel',label:'Cancel'},{id:'ok',label:'Use link',cls:'pri'}]});
      if(r.action==='ok'){const u=r.values.u.trim();if(isHttp(u)){P.images[slot]={src:u,kind:'url',alt:defAlt(slot)};change();refreshActive()}else toast('Enter a full link starting with https://')}}
    if(a==='reset'){delete P.images[slot];change();refreshActive()}
    if(a==='left'||a==='right'){const n=+slot.slice(1),m=n+(a==='left'?-1:1),o='g'+m;if(m>=1&&m<=6){const x=P.images[slot],y=P.images[o];if(y)P.images[slot]=y;else delete P.images[slot];if(x)P.images[o]=x;else delete P.images[o];change();refreshActive()}}
    return;
  }
  if(!act)return;
  if(act==='rebuild')return doRebuild();
  if(act==='reset-colors'){P.design.brand='';P.design.accent='';change();refreshActive();return}
  if(act==='regen-hero'){P=regenHero(P);change();refreshActive();toast('New hero generated');return}
  if(act==='regen-all')return regenAll();
  if(act==='multi')return pickFile(true,f=>addPhotos(f));
  if(act==='stock')return fetchStock();
  if(act==='logo-up')return pickFile(false,async f=>{try{const r=await compressImage(f[0],600,'image/png');P.info.logo=r.uri;P.logoId=rid('i');change();refreshActive();toast('Logo added · '+sizeNote(r))}catch(err){toast('Could not use that logo: '+errMsg(err),5000)}});
  if(act==='logo-rm'){P.info.logo='';P.logoId='';change();refreshActive();return}
  if(act==='save-now')return manualSave();
  if(act==='save-version'){
    const r=await ask({title:'Save a version',body:'<div class="fld"><label for="vl">Label (optional)</label><input type="text" id="vl" name="v" placeholder="e.g. Before adding new photos" maxlength="80"></div>',actions:[{id:'cancel',label:'Cancel'},{id:'ok',label:'Save version',cls:'pri'}]});
    if(r.action!=='ok')return;try{const s=await takeSnapshot(r.values.v.trim()||'Saved version',false);if(s){toast('Version saved');paneProject()}else toast('Nothing new to save yet')}catch(err){toast('Could not save a version: '+errMsg(err),5000)}return;
  }
  if(act==='ver-restore'){return restoreSnapshot(t.closest('.ver').dataset.sid)}
  if(act==='ver-del'){const sid=t.closest('.ver').dataset.sid;const r=await ask({title:'Delete this version?',body:'<p>This only removes the saved version. The current project is not affected.</p>',actions:[{id:'cancel',label:'Cancel'},{id:'go',label:'Delete version',cls:'solid-danger'}]});if(r.action==='go'){try{await DB.deleteSnapshot(sid,P.id);paneProject()}catch(err){toast('Could not delete: '+errMsg(err))}}return}
  if(act==='dup'){
    const id=await duplicateProject(P.id);if(!id)return;
    const r=await ask({title:'Project duplicated',body:'<p>The copy is in your library. The original is unchanged.</p>',actions:[{id:'stay',label:'Keep editing this one'},{id:'open',label:'Open the copy',cls:'pri'}]});
    if(r.action==='open')openProject(id);return;
  }
  if(act==='backup')return downloadBackup(P);
  if(act==='delete'){const id=P.id;if(await deleteProject(id)){P=null;REV=0;await showLibrary(true)}return}
});
/* drag & drop photos onto the Images tab / setup */
['dragover','dragleave','drop'].forEach(ev=>$('#panel').addEventListener(ev,e=>{
  const dz=e.target.closest('#dropzone');if(!dz)return;e.preventDefault();
  if(ev==='dragover')dz.classList.add('over');else dz.classList.remove('over');
  if(ev==='drop'&&e.dataTransfer&&e.dataTransfer.files.length)addPhotos(e.dataTransfer.files);
}));

/* ---------- toolbar ---------- */
$('#devices').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;DEVICE=b.dataset.d;$$('#devices button').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#device').dataset.d=DEVICE});
$('#editToggle').addEventListener('click',e=>{EDIT=!EDIT;e.currentTarget.setAttribute('aria-pressed',EDIT);e.currentTarget.textContent=EDIT?'Editing text':'Edit text';renderPreview();if(EDIT)toast('Click any text in the preview to change it')});
$('#regenBtn').addEventListener('click',e=>{
  if(!P||!P.content)return;
  showMenu(e.currentTarget,[{k:'hero',label:'New hero (headline and image)'},{k:'style',label:'Next design style'},{k:'all',label:'Whole website (copy, layout, style)'}],async k=>{
    if(k==='all')return regenAll();
    if(k==='hero'){P=regenHero(P);toast('New hero generated')}
    if(k==='style'){const cur=resolveStyle(P).st.id;P.design.style=STYLE_ORDER[(STYLE_ORDER.indexOf(cur)+1)%STYLE_ORDER.length];toast('Style: '+STYLES[P.design.style].name)}
    change();if(!inSetup()&&(TAB==='content'||TAB==='design'))setTab(TAB);else if(inSetup())renderSetup();
  });
});
$('#openFull').addEventListener('click',()=>{if(!P||!P.content)return;const u=URL.createObjectURL(new Blob([singleFile(P)],{type:'text/html'}));window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),60000)});
$('.mob').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setView(b.dataset.v)});
async function manualSave(){
  if(!P)return;
  if(!REV&&!P.info.name.trim()){toast('Enter the business name first so the project can be saved');return}
  SAVE.seq++;const ok=await flush();if(ok)toast('Project saved'+(DB.memory?' for this session only':''));
}
$('#btnSave').addEventListener('click',manualSave);
$('#btnExport').addEventListener('click',()=>{if(P&&!P.content&&P.info.name.trim()){P=generate(P);change()}openExport()});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&P&&$('#app').dataset.screen==='editor'){e.preventDefault();manualSave()}});

/* ---------- boot ---------- */
(async function boot(){
  await DB.init();
  if(!store.get('plain.unsplash')&&store.get('sitebench.unsplash'))store.set('plain.unsplash',store.get('sitebench.unsplash'));
  showLibraryScreen();
  await refreshLibrary();
})();

</script>

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('Service worker registration failed:', e); });
